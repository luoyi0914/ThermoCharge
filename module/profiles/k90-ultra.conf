# 机型参数档案：REDMI K90 Ultra（M332BF / warsaw / SM8750）
#
# match：大小写不敏感的子串，多个用 | 分隔，匹配
#        ro.product.marketname / model / device / name 拼起来的字符串。
# 匹配不到的机型回退到本档案（模块当前只维护这一份）。
#
# 数据来源：2026-11-18 开环辨识（6/10/12A 阶跃，SOC 64→82%），
#           Tamb≈25℃，alpha≈0.178 ℃/A²，tau≈220s。
# 安装时只在「键缺失」或「值仍等于 module/config.conf 的通用默认值」时覆盖，
# 用户手调过的值不会被机型档案冲掉。
match=K90 Ultra|M332BF|warsaw

# ---- 温度与电流 ----
target_temp=44.6
# 注意：用户反馈配置里写过 hard_temp=55.0，但那份文件自己的注释也说
# 「55 只是失控边缘，不建议当正常工作区防线」。机型档案用 46.0（目标 +1.4℃），
# 想要更高请自己改，不要把这个值当默认发给所有机型。
hard_temp=46.0
max_ma=12000
min_ma=1500

# ---- 控制律（辨识时的整定值）----
ki=60
kd=80
tdot_tau_s=8
slew_ma_s=750

# ---- 预测限幅 ----
pred_alpha=0.178
pred_tau_s=220
pred_ambient=25
pred_horizon_s=120
min_regulate_ma=9000
