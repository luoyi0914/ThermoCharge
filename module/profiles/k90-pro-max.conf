# 机型参数档案：REDMI K90 Pro Max
#
# match：大小写不敏感的子串，多个用 | 分隔。
#
# ⚠ 首版暂沿用 K90 Ultra 的整定值（同为保守安全参数）。
#   2026-11-18 收到的 Pro Max 开环数据在 SOC 63→74% 下实测电流恒定约 4.5A
#   （6A/10A/12A 三档没有区分度，6A 档中段甚至只有 2A），温度全程下降，
#   α/τ 不可辨识。等低 SOC（<50%）或能让电流跟档位走的条件下复测后再更新。
match=K90 Pro Max|K90 ProMax|K90Pro Max

# ---- 温度与电流（同 k90-ultra，待本机辨识后更新）----
target_temp=44.6
hard_temp=46.0
max_ma=12000
min_ma=1500

# ---- 控制律 ----
ki=60
kd=80
tdot_tau_s=8
slew_ma_s=750

# ---- 预测限幅（沿用 Ultra 的辨识值，Pro Max 未测）----
pred_alpha=0.178
pred_tau_s=220
pred_ambient=25
pred_horizon_s=120
min_regulate_ma=9000
