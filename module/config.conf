# ThermoCharge：仅按电池温度及温变趋势连续调节充电功率
# 不使用环境温度、热模型或固定功率档位。
# 修改后由 WebUI 保存通知重载，或执行 thermocharge set <键> <值>。

enabled=1
dry_run=0

# 安装迁移版本，勿手动修改。
cfg_version=7

# ---- 电池温度目标与硬保护（℃）----
target_temp=43.0
hard_temp=45.0

# ---- 电流边界（mA）----
# 电流票是执行手段，不代表内核一定按票取流；接管态看门狗会监测异常电流。
max_ma=20000
min_ma=500
startup_ma=2000

# 可选电池侧功率上限（W）：0 = 不额外限功率。
# 接受自由整数，不是预设档位，也不是要求控制器强行维持的功率目标。
power_max_w=0
# 电流票变化率上限（mA/s），用于平滑调节，不定义功率档位。
slew_ma_s=2500

# ---- 采样与回写 ----
sample_ms=500
fast_write_ms=100
log_interval_ms=1000
# 定期重投同一票值，防系统覆写；不会按重投周期跳到固定功率档。
reassert_ms=5000
# 正常插电握手宽限；过温/传感器故障保护不被宽限期豁免。
startup_grace_ms=1500

# ---- 安全 ----
hold_below_soc=95
pause_on_hard=1
restore_ma=22000000
# 默认不接管系统 FCC 温控。开启接管不能保证比系统原保护更保守。
thermal_remove=0

# ---- 执行通道（不是功率档位）----
# 0 = wired_chg_curr（µA）；1 = mca ichg_limit（mA）；2 = 双写。
ctl_mode=2
mca_tag=user
mca_type=all
