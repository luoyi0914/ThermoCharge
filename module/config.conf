# 恒温充电 ThermoCharge 配置文件
# 修改后重启生效, 或执行:
#   su -c '/data/adb/modules/thermocharge/bin/thermocharge set target_temp 42'

enabled=1
dry_run=0

# 配置版本: customize.sh 用它判断要不要做升级迁移。别手改。
cfg_version=4

# ---- 温度目标 ----
target_temp=43.0
hard_temp=45.0
deadband=0.2

# ---- 电流范围 (mA) ----
# max_ma 决定最冷情况下能跑到多大功率: 20000mA @ 4.15V ≈ 83W
# K90U 原厂快充 17600mA, 模块允许 20500mA, 这里留一点余量给 20000
# min_ma 决定温度压不住时最低保底
max_ma=20000
min_ma=500
startup_ma=2000

# ---- 控制律 ----
# 速度式 PI:  dI/dt = ki * (-误差 - kd * 温度变化率)
#   ki  mA/(℃·s)  误差每 1℃ 每秒调整的电流量。大=更激进
#   kd  阻尼秒数   大=更稳更迟钝, 小=更快但可能振荡
# 整定顺序: 先加 ki 到响应够快, 再调 kd 压超调
ki=120
kd=40
tdot_tau_s=6.0
slew_ma_s=2500

# ---- 采样与回写 ----
sample_ms=500
fast_write_ms=100
log_interval_ms=1000
# 同值重投间隔: 系统可能把我们的票关掉或覆盖成别的值,
# 即使回读看起来没变也要定期重投一次。0.5~60 秒。
reassert_ms=5000
# 插电后 20 秒内完全不写任何节点: 让快充协议认证和电荷泵爬升先跑完。
# 这期间写限流会打断 CP 起泵, 甚至让握手退到慢充。别调太小。
startup_grace_ms=20000

# ---- 安全 ----
hold_below_soc=95
pause_on_hard=1
restore_ma=22000000
# thermal_remove=1 表示清除系统温控限制。默认 0 —— 靠 Min 聚合共存,
# 绝不以取消系统保护为代价。除非你明确知道自己在做什么, 否则别改。
thermal_remove=0

# ---- 控制通道 ----
# 0 = wired_chg_curr (µA, 会被系统覆写, 需高频对抗)
# 1 = mca ichg_limit (mA, votable 投票；部分 CP 阶段不约束电流)
# 2 = 两者 (默认：同时覆盖 votable 与 wired/电荷泵通道)
ctl_mode=2
mca_tag=user
mca_type=all
